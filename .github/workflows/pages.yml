# GitHub Pages へ公開する。
# リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
# main への push ごとに、検証に合格したらサイトを公開する（手動実行も可）。
name: GitHub Pages 公開
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 化学データ検証（不合格なら公開しない）
        run: npm test
      - name: 公開ファイルの準備
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js data icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
